<!DOCTYPE html>
<html>
  <head>
    <title>OMDb Movie Search</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>

  <body style="background-color:#bdbaba;" class="text-dark">

    <div class="container mt-5">

      <h2 class="mb-4 text-left">OMDb Movie Search</h2>

      <!-- SEARCH BAR -->
      <div
        class="d-flex align-items-center mb-3">

        <!-- Search input movie -->
        <input type="text" id="searchInput"
          class="form-control text-center mr-4"
          style="max-width: 140px;"
          placeholder="Search movie...">

        <!-- Type label -->
        <span class="mr-2">Type:</span>

        <!-- Select  all , series, episode -->
        <select id="typeSelect"
          class="form-control mr-3"
          style="max-width: 300px;">
          <option value>All</option>
          <option value="movie">Movie</option>
          <option value="series">Series</option>
          <option value="episode">Episode</option>
        </select>

        <!-- Button -->
        <button id="searchBtn" class="btn btn-primary">
          Search
        </button>

      </div>

      <!-- Results -->
      <div id="results" class="row"></div>

      <!-- Pagination -->
      <div id="pagination" style="display:none; width:100%; margin-top:20px;">
        <div class="d-flex justify-content-between align-items-center">
          <button id="prevBtn" class="btn btn-secondary">Previous...</button>
          <button id="nextBtn" class="btn btn-secondary">Next</button>
        </div>
      </div>

    </div>

    <script src="app.js"></script>

  </body>
</html>
